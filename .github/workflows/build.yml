name: Build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write   # tag 触发时创建 GitHub Release

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: true

      # 首次构建会下载 IntelliJ IDEA Community 2023.1 (约 1GB),之后由 Gradle 缓存加速
      # 打 tag 时用 tag 号强制覆盖版本,保证 Release 附件 / Marketplace 版本与 tag 一致
      - name: Build plugin
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            ./gradlew buildPlugin "-PpluginVersion=${GITHUB_REF_NAME#v}"
          else
            ./gradlew buildPlugin
          fi

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: GitLabPlus-${{ github.sha }}
          path: build/distributions/*.zip
          if-no-files-found: error
          retention-days: 30

      # 插件 zip 挂到 Release,用户无需认证即可下载安装
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" --generate-notes build/distributions/*.zip

      # 更新自定义插件仓库索引,供 IDE "Manage Plugin Repositories" 检查更新
      # 仓库 URL: https://raw.githubusercontent.com/cn3shy/GitLabPlus/main/updatePlugins.xml
      - name: Update plugin repository index
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          ZIP_URL="https://github.com/cn3shy/GitLabPlus/releases/download/${GITHUB_REF_NAME}/GitLabPlus-${VERSION}.zip"
          cat > updatePlugins.xml <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <plugins>
              <plugin id="com.gitlabmr.mrplugin" name="GitLabPlus" version="${VERSION}" url="${ZIP_URL}">
                  <idea-version since-build="231"/>
                  <change-notes><![CDATA[GitLabPlus ${VERSION}]]></change-notes>
              </plugin>
          </plugins>
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add updatePlugins.xml
          git diff --cached --quiet || git commit -m "ci: updatePlugins.xml -> v${VERSION}"
          git push origin HEAD:main
