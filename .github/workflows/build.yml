name: Build

# 只在打版本 tag 时构建 (tag 号即版本号)，日常 push 不触发
on:
  push:
    tags: [ 'v*' ]

permissions:
  contents: write   # 创建 GitHub Release

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: true

      # 首次构建会下载 IntelliJ IDEA 2025.3 (约 1GB),之后由 Gradle 缓存加速
      # 用 tag 号强制覆盖版本,保证 Release 附件 / Marketplace 版本与 tag 一致
      - name: Build plugin
        run: ./gradlew buildPlugin "-PpluginVersion=${GITHUB_REF_NAME#v}"

      # 上传到 JetBrains Marketplace(IDE 的"自动更新"来自市场,不再需要自定义插件仓库索引)
      # 需在仓库 Secrets 中配置 PUBLISH_TOKEN:Marketplace → 头像 → My Tokens
      - name: Publish to JetBrains Marketplace
        env:
          PUBLISH_TOKEN: ${{ secrets.PUBLISH_TOKEN }}
        run: ./gradlew publishPlugin "-PpluginVersion=${GITHUB_REF_NAME#v}"

      # 插件 zip 挂到 Release,用户无需认证即可下载安装
      # 放在发布之后:Marketplace 上传失败就不会留下 Release,便于修复后重跑
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" --generate-notes build/distributions/*.zip
